<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <title>퍼스트펭귄 — 매일 한 컷</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Pretendard&display=swap" rel="stylesheet"/>
  <!-- 배민워크체 (Woowahan 사내 폰트). 설치된 기기는 그걸 사용, 아니면 BMHANNAPro로 fallback. -->
  <style>
    @font-face {
      font-family: 'BMHANNAPro';
      src: url('https://cdn.jsdelivr.net/gh/webfontworld/woowahan/BMHANNAPro.woff2') format('woff2'),
           url('https://cdn.jsdelivr.net/gh/webfontworld/woowahan/BMHANNAPro.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <link rel="stylesheet" href="styles.css"/>

  <!-- Supabase config — replaced by build.js at deploy time -->
  <script>
    window.SUPABASE_URL = "https://ykefsjdljioihxnkayii.supabase.co";
    window.SUPABASE_ANON_KEY = "sb_publishable_V7VDS1g7gh9BBXfq-PXr8Q_RSu-Ity5";
  </script>

  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    body { background: var(--bg); }
    .app-shell { max-width: 1280px; margin: 0 auto; }
    .topnav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(248, 246, 240, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      max-width: 1280px; margin: 0 auto;
    }
    .topnav-inner {
      display: flex; align-items: center; gap: 18px;
      padding: 10px 36px;
    }
    .topnav .brand {
      font-family: '배민워크체', 'BM WORK', 'BMWORK', 'BMHANNAPro', 'Baemin Work', sans-serif;
      font-size: 22px;
      letter-spacing: -0.01em;
      cursor: pointer;
    }
    .topnav .navlink {
      all: unset; cursor: pointer;
      padding: 6px 12px; border-radius: 6px;
      font-size: 13px; font-weight: 500; color: var(--ink-2);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .topnav .navlink.active { background: var(--ink); color: #fff7e6; }
    .topnav .navlink:hover:not(.active) { background: var(--bg-2); }
    .loading-screen {
      min-height: 100vh; display: grid; place-items: center;
      font-family: var(--font-display); font-style: italic; font-size: 32px;
      color: var(--ink-3);
    }
  </style>
</head>
<body>
  <div id="root"><div class="loading-screen">first penguin · 로딩 중…</div></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="proto-helpers.jsx"></script>
  <script type="text/babel" src="proto-video.jsx"></script>
  <script type="text/babel" src="proto-player.jsx"></script>
  <script type="text/babel" src="supabase-client.jsx"></script>
  <script type="text/babel" src="auth-screen.jsx"></script>
  <script type="text/babel" src="proto-comments.jsx"></script>
  <script type="text/babel" src="proto-contact-sheet-live.jsx"></script>
  <script type="text/babel" src="proto-roll-live.jsx"></script>
  <script type="text/babel" src="proto-player-live.jsx"></script>

  <script type="text/babel" data-presets="react">
    function parseHash() {
      const h = (location.hash || '').replace(/^#\/?/, '');
      const parts = h.split('/').filter(Boolean);
      if (parts.length === 0 || parts[0] === 'today') return { route: 'today', viewKey: todayKey() };
      if (parts[0] === 'd' && parts[1]) return { route: 'today', viewKey: parts[1] };
      if (parts[0] === 'roll') return { route: 'roll', viewKey: todayKey() };
      return { route: 'today', viewKey: todayKey() };
    }
    function buildHash({ route, viewKey }) {
      if (route === 'today') return viewKey === todayKey() ? '#/today' : `#/d/${viewKey}`;
      if (route === 'roll') return '#/roll';
      return '#/today';
    }

    const App = () => {
      const [t, setTweak] = useTweaks({ filmGrain: true });
      const auth = useAuth();
      const [nav, setNav] = React.useState(parseHash());
      const [player, setPlayer] = React.useState(null);

      React.useEffect(() => {
        const onHash = () => setNav(parseHash());
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      // Configuration check
      if (!window.__supabaseConfigured) {
        return <AuthScreen configured={false}/>;
      }

      // Loading auth — show spinner briefly
      if (auth.loading) {
        return <div className="loading-screen">first penguin</div>;
      }

      // Signed-in user but member row not yet ready
      if (auth.session && !auth.member) {
        return <div className="loading-screen">계정 준비 중…</div>;
      }

      // Render app for everyone — signed-in users have me, viewers have null
      return <SignedInApp
        me={auth.member} signedIn={!!auth.session}
        onSignIn={signInWithGoogle} onSignOut={signOut}
        nav={nav} setNav={setNav}
        player={player} setPlayer={setPlayer}
        t={t} setTweak={setTweak}/>;
    };

    const SignedInApp = ({ me, signedIn, onSignIn, onSignOut, nav, setNav, player, setPlayer, t, setTweak }) => {
      const { members, days, loaded } = useRealtimeStore();
      const [backfillProgress, setBackfillProgress] = React.useState(null);

      const runBackfill = async () => {
        if (backfillProgress) return;
        if (!confirm('기존 영상들의 썸네일을 일괄 생성합니다. 영상 수에 따라 몇 분 걸릴 수 있어요. 시작할까요?')) return;
        setBackfillProgress({ done: 0, total: 0 });
        try {
          const result = await backfillThumbnails(p => setBackfillProgress(p));
          setBackfillProgress({ ...result, finished: true });
          setTimeout(() => setBackfillProgress(null), 5000);
        } catch (e) {
          alert('실패: ' + e.message);
          setBackfillProgress(null);
        }
      };

      const navigate = (route, arg) => {
        const newNav = { route, viewKey: arg || nav.viewKey };
        setNav(newNav);
        const h = buildHash(newNav);
        if (location.hash !== h) history.pushState(null, '', h);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      const setViewKey = (k) => {
        const n = { ...nav, viewKey: k };
        setNav(n);
        const h = buildHash(n);
        if (location.hash !== h) history.pushState(null, '', h);
      };

      const openPlayer = (sub, dayKey) => setPlayer({ subId: sub.id, dayKey });
      const closePlayer = () => setPlayer(null);
      const playerSub = player
        ? days[player.dayKey]?.subs.find(s => s.id === player.subId)
        : null;
      const playerMember = playerSub ? members.find(m => m.id === playerSub.memberId) : null;

      if (!loaded) return <div className="loading-screen">데이터 동기화 중…</div>;

      return (
        <>
          <nav className="topnav">
            <div className="topnav-inner">
              <span className="brand" onClick={() => navigate('today')}>
                <span style={{ fontStyle:'normal', fontWeight: 600, marginRight: 4 }}>퍼스트펭귄</span>
                <span style={{ color:'var(--ink-3)' }}>· first penguin</span>
              </span>
              <div style={{ flex: 1 }}/>
              <button className={`navlink ${nav.route === 'today' ? 'active' : ''}`}
                onClick={() => navigate('today')}>
                <Icon name="home" size={12}/>오늘
              </button>
              <button className={`navlink ${nav.route === 'roll' ? 'active' : ''}`}
                onClick={() => navigate('roll')}>
                <Icon name="archive" size={12}/>전체보기
              </button>
              <span style={{ display:'flex', alignItems:'center', gap: 8, padding:'4px 10px',
                background:'var(--bg-2)', borderRadius: 6, fontSize: 12 }}>
                {signedIn
                  ? <><Avatar member={me} size={20}/>{me.name}</>
                  : <span style={{ color:'var(--ink-3)' }}>👀 보기 전용</span>
                }
              </span>
              {signedIn
                ? <button className="navlink" onClick={onSignOut}>로그아웃</button>
                : <button className="navlink" onClick={onSignIn}
                    style={{ background:'var(--ink)', color:'#fff7e6' }}>
                    Google 로그인
                  </button>
              }
            </div>
          </nav>

          <div className="app-shell">
            {nav.route === 'today' && (
              <ContactSheetLive
                tweaks={t}
                me={me}
                members={members}
                days={days}
                viewKey={nav.viewKey}
                setViewKey={setViewKey}
                navigate={navigate}
                openPlayer={openPlayer}
              />
            )}
            {nav.route === 'roll' && (
              <RollLive
                tweaks={t}
                members={members}
                days={days}
                openPlayer={openPlayer}
                navigate={navigate}
              />
            )}
          </div>

          <PlayerLive
            open={!!player}
            sub={playerSub}
            member={playerMember}
            members={members}
            me={me}
            onClose={closePlayer}
          />

          <TweaksPanel>
            <TweakSection label="필름 룩"/>
            <TweakToggle label="필름 그레인"
              value={t.filmGrain}
              onChange={v => setTweak('filmGrain', v)}/>
            <TweakSection label="계정"/>
            <TweakButton onClick={onSignOut}>로그아웃</TweakButton>
            <TweakSection label="유지보수"/>
            <TweakButton onClick={runBackfill}>기존 영상 썸네일 일괄 생성</TweakButton>
          </TweaksPanel>

          {backfillProgress && (
            <div style={{
              position: 'fixed', inset: 0, zIndex: 9999,
              background: 'rgba(15,14,12,0.6)',
              backdropFilter: 'blur(6px)',
              display: 'grid', placeItems: 'center',
            }}>
              <div style={{
                background: 'white', borderRadius: 12,
                padding: 30, width: 360,
                boxShadow: 'var(--shadow-md)',
                fontFamily: 'var(--font-sans)',
              }}>
                <div className="t-eyebrow" style={{ marginBottom: 8 }}>썸네일 일괄 생성</div>
                <h3 style={{ margin: 0, fontSize: 22, fontWeight: 700 }}>
                  {backfillProgress.finished
                    ? `완료! ${backfillProgress.processed}개 처리됨`
                    : backfillProgress.total === 0
                      ? '대상 영상 확인 중…'
                      : `${backfillProgress.done} / ${backfillProgress.total}`}
                </h3>
                {!backfillProgress.finished && backfillProgress.total > 0 && (
                  <div style={{
                    marginTop: 16, height: 8, borderRadius: 4,
                    background: 'var(--bg-2)', overflow: 'hidden',
                  }}>
                    <div style={{
                      height: '100%', width: `${(backfillProgress.done / backfillProgress.total) * 100}%`,
                      background: 'var(--accent)',
                      transition: 'width .3s',
                    }}/>
                  </div>
                )}
                {backfillProgress.errors?.length > 0 && (
                  <div style={{ marginTop: 12, fontSize: 12, color: 'var(--miss)' }}>
                    {backfillProgress.errors.length}개 실패 (콘솔 확인)
                  </div>
                )}
                {backfillProgress.finished && (
                  <button className="btn primary" style={{ marginTop: 18 }}
                    onClick={() => setBackfillProgress(null)}>닫기</button>
                )}
              </div>
            </div>
          )}
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
